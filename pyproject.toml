[project]
name = "regin"
version = "0.1.0"
description = "Pipeline resolver — transforms agent definitions through Nornir-gated stages into platform-ready render format"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7",
    "markdown-it-py>=3.0",
    "pydantic>=2.0",
    "typer>=0.9",
]

[project.scripts]
regin = "regin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "datamodel-code-generator>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
